security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # Les utilisateurs sont chargés depuis MySQL ; ils se connectent avec leur nom d'utilisateur.
        app_user_provider:
            entity:
                class: App\Entity\User
                property: name

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build|images|css|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            # Refuse la connexion tant que l'adresse e-mail n'a pas été confirmée.
            user_checker: App\Security\UserChecker
            # Accès refusé à un utilisateur connecté : retour à l'accueil avec un message.
            access_denied_handler: App\Security\AccessDeniedHandler
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # Après connexion, l'utilisateur arrive toujours sur la page d'accueil.
                default_target_path: app_home
                always_use_default_target_path: true
            # Freine les attaques par force brute : 5 tentatives par minute.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            logout:
                path: app_logout
                target: app_home
                # Le lien de déconnexion porte un jeton : un site tiers ne peut pas déconnecter l'utilisateur.
                enable_csrf: true

    # Seule la première règle qui correspond est appliquée.
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/(products|product|cart|checkout), roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
